# The service's settings (docs/api.md, "Settings"). A deployment overrides them in settings.local.toml,
# which git ignores, or in the environment.

# The service's token, which reaches every route, is `token` here; a deployment sets it, and an empty one
# lets no caller in by it.
[server]
listen = "127.0.0.1:3230"

# The console's token is `token` here; a deployment sets it, and an empty one lets no console in. The console
# bundle is read from `bundle`, client/dist until it names another folder. The other services the screens call
# through the console, the console's translator among them, are `calls` here; a deployment names them, and none
# is named until it does.
[console]

# bmo-ui's audio player script and its words, which a hosted page loads, are read from `folder`, client/player
# until it names another.
[player]

[database]
url = "postgres://localhost/bmo_artifact"

[files]
root = "data"

# The data root bmo-explorer's client is opened over, where it keeps its own folder.
[explorer]
data_root = "data"

# The account service a reader's unit and a share's company are asked of is `address` here, called with its
# server's `token`; a deployment sets both, and none is named until it does.
[accounts]

# The address a share link's url stands under is `address` here; a deployment sets it.
[share]

# The document wording file is the English default in lang/ until `file` names another.
[wording]

# The prefix that marks a row naming no kind as an import is `kindless_import_prefix` here; a deployment
# whose rows were written before the kind was kept sets it.
[documents]

# A SharePoint place reaches Microsoft Graph at `graph`, its own address until another is named, with a token
# borrowed through an optional page-token service's page token road at `tokens`, presenting this service's own caller `token`; a
# deployment sets both, and none is named until it does.
[sharepoint]
