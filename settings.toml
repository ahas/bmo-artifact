# The service's settings (docs/api.md, "Settings"). A deployment overrides them in settings.local.toml,
# which git ignores, or in the environment.

# The bearer token every caller presents is `token` here; a deployment sets it, and an empty one lets no
# caller in.
[server]
listen = "127.0.0.1:3230"

[database]
url = "postgres://localhost/bmo_artifact"

[files]
root = "data"

# The data root bmo-explorer's client is opened over, where it keeps its own folder.
[explorer]
data_root = "data"

# The address a share link's url stands under is `address` here; a deployment sets it.
[share]

# The document wording file is the English default in lang/ until `file` names another.
[wording]

# The prefix that marks a row naming no kind as an import is `kindless_import_prefix` here; a deployment
# whose rows were written before the kind was kept sets it.
[documents]
