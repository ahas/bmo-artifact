# The document wording file's English default (docs/api.md, "The document wording"): the lines the
# service writes into a document a person reads. A deployment may name another file in its settings; that
# file holds every key this one holds and no other. Each `{name}` is filled in with what it names.

# What an imported page's document says of itself beside the page's own words.
import:
  # A figure of the page that could not be kept, by its number {n} and its {caption}.
  missing: "Figure {n} could not be kept: {caption}"
