# The document wording file's English default (docs/api.md, "Wording"): what a document this service
# writes says of itself, and what a search leaves for a person to read. A deployment may name another file
# in its settings; that file holds every key this one holds and no other. Each `{name}` is filled in with
# what it names.

# What a document filed into the archive says of itself.
archive_docs:
  # The header's lines under the document's title: its {kind} by the label under `kinds`, the {request} it
  # was written for, the {time} it was written, and the {names} of the files it keeps, where it keeps any.
  header:
    kind: "- Kind: {kind}"
    request: "- Request: {request}"
    written: "- Written: {time}"
    attached: "- Attached: {names}"

  # What each kind of document filed here is called, by the kind's own name.
  kinds:
    record: "Record"
    learning: "Learning material"
    import: "Original"
    page: "Page"

  # A moment as the documents tell it, in the time zone the settings name: {year}, {month} and {day}, the
  # {half} of the day, and the {hour} on a twelve-hour clock with its {minute}.
  time:
    line: "{month}/{day}/{year} {hour}:{minute} {half}"
    morning: "AM"
    afternoon: "PM"

# What a search leaves for a person to read: the document a search run writes, and the result a page
# brought in whole is written as.
search:
  # What the console's collection of documents is called, which a room is told a page brought in whole was
  # kept in.
  archive_name: "Archive"

  # The question a page brought in whole stands under, by the {source} address it was asked from.
  import_query: "Bring in the original: {source}"

  # The document's head: its title where the result gave none, by the {query}; and its lines, each with the
  # {value} it states, an option by its {name}.
  head:
    untitled: "Search · {query}"
    query: "- Question: {value}"
    topic: "- Topic: {value}"
    keywords: "- Keywords: {value}"
    rule: "- Rule applied: {value}"
    option: "- Option {name}: {value}"
    depth: "- Depth: {value}"
    status: "- Status: {value}"
    started: "- Started: {value}"
    finished: "- Finished: {value}"
    runs: "- Runs: {value}"

  # The result the room was given: its heading, what stands under it while nothing is written, the branch a
  # finding came out of by its {branch} label, and the heading of the pages it cites.
  result:
    heading: "Result"
    empty: "Nothing has been written yet."
    branch: "Branch: {branch}"
    sources: "Sources"

  # The trail folded under the result: its heading and the line that opens it, the run's own section, the
  # mark of the {run} a branch was opened in where the search took several, and the headings of what one
  # branch asked, opened and found.
  trail:
    heading: "How it was researched"
    summary: "What each branch asked and the pages it opened"
    own: "This run itself"
    run: " · run {run}"
    asked: "What was asked"
    opened: "Pages opened"
    found: "What came of it"

  # What each fixed part of a result's body is called.
  parts:
    VERDICT: "Short answer"
    SUMMARY: "Summary"
    INTRO: "Introduction"
    BODY: "Body"
    CONCLUSION: "Conclusion"
    UNCONFIRMED: "Not confirmed"
    MORE: "In detail"

  # What each line of an entry is written as, with the {value} the line carries; a stock line's {value} is
  # its state, when it was read and where, joined; a deal's {now} price, its {usual} one where given and
  # the {real} word on it; a review's link to the {page} it stands on; a picture kept as the archive's own
  # copy says the {address} it came from. The rating a result writes where there is none is `no_rating`.
  fields:
    ADDRESS: "Address: {value}"
    MAP: "Map: {value}"
    ROADVIEW: "Street view: {value}"
    MENU: "Menu: {value}"
    menu_alone: "Menu:"
    RELEASED: "Released: {value}"
    NEWER: "Newer model: {value}"
    STOCK: "Availability: {value}"
    deal: "Deal: {now}{usual}{real}"
    deal_usual: " (usually {usual})"
    deal_real: " · {real}"
    review_link: " ([review]({page}))"
    no_rating: "none"
    original: "Original: {address}"

  # A page brought in whole, as its result: the line that says it was answered, its topic by the page's
  # {host}, the figure {n} with its {caption} that could not be captured, and what each source line says of
  # the page kept, of the address asked that moved to it, and of a work the page cites with its {text}
  # where any.
  import:
    answered: "The original was brought in as it stands"
    topic: "The original from {host}"
    missing: "Figure {n} ({caption}) could not be captured, so only its original address is left."
    kept: "The original page brought in"
    moved: "The address asked for, which moved to the page above"
    cited: "A work the original cites"
    cited_text: "A work the original cites: {text}"
