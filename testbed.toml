# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration
# format.
testbed = 0
name = "bmo-artifact"

[test]
languages = ["cargo", "bun"]
# The console plugin bundle under client/ is a project of its own, found by its manifest and its Bun
# lockfile; its check script runs its typecheck and its tests.
setup = ["cd client && bun install --frozen-lockfile"]

[test.database]
migrations = ["src/store/migration/**"]
migrate = "BMO_ARTIFACT_DATABASE__URL=\"$BMO_TEST_TEMPLATE_URL\" cargo run --quiet --bin bmo-artifact -- migrate"

[check]
quick = ["layout", "dependencies", "cargo-profile", "shared-versions", "personal-data"]
# The base libraries, bmo-chat's console face among them, bmo-explorer, whose published client crate the
# imports read pages through, and bmo-web-client, bmo-web's published client crate the readers' units are
# asked through.
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-console-face", "bmo-ui", "bmo-explorer", "bmo-web-client"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# No static step is declared for the server. The testbed's own Cargo workspace check formats and lints the
# crate, every target compiled, through its Cargo verb in the shared build directory, wherever a change marks it,
# and the change check compiles every crate a change marks; a change that marks none has no Rust to judge.

# The service's binary, and the executable of the tool a tool host places (docs/api.md, "The tool a tool host
# places").
[build]
binaries = ["bmo-artifact", "artifact-tool"]

# The document service's own deploy tree, and the data root it shares with the services whose files
# stand under it (docs/layout.md, 「Storage」). The release reads its own values from
# settings.local.toml, a link into the data root's env/, so the deployment's backup carries them.
[deploy]
root = "~/.local/share/bmo-artifact"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.local.toml", target = "env/artifact.toml" }]
units = ["deploy/*.service"]
# Answers 0 once the service the release's settings name answers on its listen address, 127.0.0.1:3230
# by default (docs/api.md, 「Health」).
health = "cd ~/.local/share/bmo-artifact/deploy && bin/bmo-artifact health"

# The console bundle, built in the release into the folder the settings name by default, and bmo-ui's audio
# player with its words into the player folder beside it, where the service reads them when it starts
# (docs/api.md, 「The console」 and 「Readings」).
[[deploy.step]]
id = "console-module"
command = "cd client && bun run module"
phase = "before-flip"

# The console probe a deployment runs once the service answers (bmo-testbed's docs/deploy.md): the address, the
# console's token and the service's token, as the release's settings name them.
[deploy.console]
reach = "bin/bmo-artifact console-reach"

# The document tables are brought to the schema the release carries before it is flipped, so a migration
# runs at the deployment that brings it and no service meets a table it does not have (docs/api.md,
# "The command").
[[deploy.step]]
id = "migrate"
command = "bin/bmo-artifact migrate"
phase = "before-flip"

# The Artifact app the console screen is, published on the delegation chain once the service answers ready, from the
# declaration the release carries, so a person's settings can switch the screen (deploy/app.toml; bmo-pocket's
# docs/api.md, 「An app on the delegation chain」).
[[deploy.step]]
id = "publish-app"
phase = "after-health"
command = '''
set -eu
bmo pocket app deploy/app.toml
'''

# The tool a tool host places, as one folder: its release executable, the release's settings.toml its calls read
# the defaults from, its manifest and its schemas, registered with the tool host as this repository's own and
# allowed the one capability its entries ask for (docs/api.md, "The tool a tool host places"; bmo-pocket's
# docs/registry.md, "Put").
[[deploy.step]]
id = "register-artifact-tool"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/artifact/.placed
mkdir -p tools/artifact/.placed
cp bin/artifact-tool settings.toml tools/artifact/tool.toml tools/artifact/*.json tools/artifact/.placed/
bmo pocket put tools/artifact/.placed --placed --service bmo-artifact --allow documents.file
'''
